<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#07111f">

<title>Login | LINK4 COMMUNICATION</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    font-family:'Inter',sans-serif;

    background:#07111f;

    color:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow-x:hidden;

}


/* =====================================================
   ROOT
===================================================== */

:root{

    --bg:#07111f;

    --card:rgba(255,255,255,.055);

    --border:rgba(255,255,255,.10);

    --green:#00d084;

    --blue:#149cff;

    --muted:#8c9aad;

}


/* =====================================================
   BACKGROUND
===================================================== */

body::before{

    content:"";

    position:fixed;

    width:550px;

    height:550px;

    top:-220px;

    left:-200px;

    background:rgba(0,208,132,.09);

    filter:blur(120px);

    border-radius:50%;

    z-index:-1;

}


body::after{

    content:"";

    position:fixed;

    width:550px;

    height:550px;

    right:-220px;

    bottom:-220px;

    background:rgba(20,156,255,.10);

    filter:blur(120px);

    border-radius:50%;

    z-index:-1;

}


/* =====================================================
   MAIN
===================================================== */

.login-wrapper{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:30px;

}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card{

    width:100%;

    max-width:440px;

    padding:42px;

    background:

    linear-gradient(

        145deg,

        rgba(255,255,255,.075),

        rgba(255,255,255,.025)

    );

    border:1px solid var(--border);

    border-radius:24px;

    box-shadow:

    0 30px 90px

    rgba(0,0,0,.40);

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    animation:cardShow .7s ease both;

}


@keyframes cardShow{

    from{

        opacity:0;

        transform:translateY(25px) scale(.98);

    }

    to{

        opacity:1;

        transform:translateY(0) scale(1);

    }

}


/* =====================================================
   LOGO
===================================================== */

.logo-area{

    text-align:center;

    margin-bottom:32px;

}


.logo-box{

    width:62px;

    height:62px;

    margin:0 auto 16px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:17px;

    background:

    linear-gradient(

        135deg,

        #00d084,

        #008fff

    );

    font-size:21px;

    font-weight:800;

    box-shadow:

    0 15px 40px

    rgba(0,208,132,.20);

}


.logo-title{

    font-size:18px;

    font-weight:800;

    letter-spacing:.5px;

}


.logo-sub{

    margin-top:5px;

    color:#718095;

    font-size:9px;

    letter-spacing:2px;

}


/* =====================================================
   HEADING
===================================================== */

.login-heading{

    text-align:center;

    margin-bottom:28px;

}


.login-heading h1{

    font-size:25px;

    font-weight:800;

    margin-bottom:8px;

}


.login-heading p{

    color:var(--muted);

    font-size:12px;

    line-height:1.7;

}


/* =====================================================
   FORM
===================================================== */

.form-group{

    margin-bottom:19px;

}


.form-group label{

    display:block;

    margin-bottom:8px;

    color:#c8d2df;

    font-size:11px;

    font-weight:600;

}


.input-box{

    position:relative;

}


.input-box i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#718095;

    font-size:13px;

    pointer-events:none;

}


.input-box input{

    width:100%;

    height:50px;

    padding:0 45px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.09);

    outline:none;

    background:rgba(255,255,255,.045);

    color:white;

    font-family:inherit;

    font-size:13px;

    transition:.3s;

}


.input-box input::placeholder{

    color:#617083;

}


.input-box input:focus{

    border-color:rgba(0,208,132,.55);

    background:rgba(255,255,255,.065);

    box-shadow:

    0 0 0 3px

    rgba(0,208,132,.08);

}


.password-toggle{

    position:absolute;

    right:14px;

    top:50%;

    transform:translateY(-50%);

    color:#718095;

    cursor:pointer;

    font-size:13px;

    transition:.3s;

}


.password-toggle:hover{

    color:#00d084;

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-btn{

    width:100%;

    height:52px;

    margin-top:7px;

    border:0;

    border-radius:11px;

    background:

    linear-gradient(

        135deg,

        #00c878,

        #008fff

    );

    color:white;

    font-family:inherit;

    font-size:13px;

    font-weight:800;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    transition:.3s;

}


.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:

    0 15px 35px

    rgba(0,170,220,.25);

}


.login-btn:disabled{

    opacity:.65;

    cursor:not-allowed;

    transform:none;

}


/* =====================================================
   LOADING
===================================================== */

.loading-spinner{

    width:16px;

    height:16px;

    border:2px solid rgba(255,255,255,.35);

    border-top-color:white;

    border-radius:50%;

    animation:spin .7s linear infinite;

}


@keyframes spin{

    to{

        transform:rotate(360deg);

    }

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    display:none;

    margin-top:17px;

    padding:12px 14px;

    border-radius:10px;

    font-size:11px;

    line-height:1.6;

    text-align:center;

}


.message.show{

    display:block;

}


.message.error{

    color:#ff9b9b;

    background:rgba(255,70,70,.08);

    border:1px solid rgba(255,70,70,.15);

}


.message.success{

    color:#7dffca;

    background:rgba(0,208,132,.08);

    border:1px solid rgba(0,208,132,.15);

}


/* =====================================================
   FOOTER
===================================================== */

.login-footer{

    text-align:center;

    margin-top:27px;

    padding-top:22px;

    border-top:1px solid rgba(255,255,255,.06);

}


.back-home{

    display:inline-flex;

    align-items:center;

    gap:8px;

    color:#8190a4;

    text-decoration:none;

    font-size:11px;

    transition:.3s;

}


.back-home:hover{

    color:#00d084;

}


.security-text{

    margin-top:15px;

    color:#566578;

    font-size:9px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

}


.security-text i{

    color:#00d084;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    .login-wrapper{

        padding:20px;

    }

    .login-card{

        padding:30px 22px;

        border-radius:20px;

    }

    .logo-title{

        font-size:16px;

    }

    .login-heading h1{

        font-size:22px;

    }

}

</style>

</head>


<body>


<div class="login-wrapper">


<div class="login-card">


<!-- =====================================================
     LOGO
===================================================== -->

<div class="logo-area">

<div class="logo-box">
L4
</div>

<div class="logo-title">
LINK4 COMMUNICATION
</div>

<div class="logo-sub">
MANAGEMENT SYSTEM
</div>

</div>


<!-- =====================================================
     HEADING
===================================================== -->

<div class="login-heading">

<h1>
Welcome Back
</h1>

<p>
Sign in to access your management workspace.
</p>

</div>


<!-- =====================================================
     LOGIN FORM
===================================================== -->

<form id="loginForm">


<div class="form-group">

<label for="username">
Username
</label>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="username"
placeholder="Enter your username"
autocomplete="username"
required
>

</div>

</div>


<div class="form-group">

<label for="password">
Password
</label>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"
required
>

<span
class="password-toggle"
id="togglePassword">

<i class="fa-solid fa-eye"></i>

</span>

</div>

</div>


<button
type="submit"
class="login-btn"
id="loginBtn">

<i class="fa-solid fa-right-to-bracket"></i>

<span id="loginText">
Login to System
</span>

</button>


</form>


<!-- =====================================================
     MESSAGE
===================================================== -->

<div
class="message"
id="message">
</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<div class="login-footer">

<a
href="index.html"
class="back-home">

<i class="fa-solid fa-arrow-left"></i>

Back to Home

</a>


<div class="security-text">

<i class="fa-solid fa-shield-halved"></i>

Secure Management Access

</div>

</div>


</div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxbgyIg_ddBYIs8qkQvRN3xS3-ZG451C5y_2sNbVFWdWydzb9Mc6qV5CoWB5rjs91ghjQ/exec";


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
document.getElementById("loginForm");

const usernameInput =
document.getElementById("username");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const loginText =
document.getElementById("loginText");

const message =
document.getElementById("message");

const togglePassword =
document.getElementById("togglePassword");


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

togglePassword.addEventListener(
"click",
function(){

    if(
        passwordInput.type === "password"
    ){

        passwordInput.type = "text";

        this.innerHTML =
        '<i class="fa-solid fa-eye-slash"></i>';

    }else{

        passwordInput.type = "password";

        this.innerHTML =
        '<i class="fa-solid fa-eye"></i>';

    }

});


/* =====================================================
   MESSAGE FUNCTION
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
    text;

    message.className =
    "message show " + type;

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
"submit",
async function(e){

    e.preventDefault();


    const username =
    usernameInput.value.trim();

    const password =
    passwordInput.value.trim();


    if(
        !username ||
        !password
    ){

        showMessage(
            "Please enter username and password.",
            "error"
        );

        return;

    }


    /* ===============================
       LOADING
    =============================== */

    loginBtn.disabled =
    true;

    loginText.textContent =
    "Checking Login...";


    loginBtn.insertAdjacentHTML(
        "afterbegin",
        '<span class="loading-spinner"></span>'
    );


    try{


        /* ===============================
           API REQUEST
        =============================== */

        const response =
        await fetch(

            API_URL +

            "?action=login" +

            "&username=" +

            encodeURIComponent(username) +

            "&password=" +

            encodeURIComponent(password),

            {

                method:"GET",

                cache:"no-store"

            }

        );


        if(
            !response.ok
        ){

            throw new Error(
                "Server connection failed."
            );

        }


        const data =
        await response.json();


        /* ===============================
           LOGIN SUCCESS
        =============================== */

        if(
            data.success === true
        ){

            showMessage(
                "Login successful. Redirecting...",
                "success"
            );


            /* ===============================
               SAVE USER SESSION
            =============================== */

            localStorage.setItem(
                "loggedIn",
                "true"
            );


            localStorage.setItem(
                "username",
                data.username || username
            );


            localStorage.setItem(
                "name",
                data.name || ""
            );


            localStorage.setItem(
                "role",
                data.role || ""
            );


            localStorage.setItem(
                "status",
                data.status || "Active"
            );


            /* ===============================
               REDIRECT
            =============================== */

            setTimeout(

                function(){

                    window.location.href =
                    "dashboard.html";

                },

                700

            );


        }else{


            showMessage(

                data.message ||

                "Invalid username or password.",

                "error"

            );


            loginBtn.disabled =
            false;

            loginText.textContent =
            "Login to System";


            const spinner =
            loginBtn.querySelector(
                ".loading-spinner"
            );

            if(
                spinner
            ){

                spinner.remove();

            }

        }


    }catch(error){


        console.error(
            "Login Error:",
            error
        );


        showMessage(

            "Unable to connect to the login server. Please try again.",

            "error"

        );


        loginBtn.disabled =
        false;

        loginText.textContent =
        "Login to System";


        const spinner =
        loginBtn.querySelector(
            ".loading-spinner"
        );


        if(
            spinner
        ){

            spinner.remove();

        }

    }

});


/* =====================================================
   ENTER KEY
===================================================== */

passwordInput.addEventListener(
"keydown",
function(e){

    if(
        e.key === "Enter"
    ){

        loginForm.requestSubmit();

    }

});


</script>


</body>

</html>
